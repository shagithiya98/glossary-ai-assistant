spring.application.name=glossary-ai-assistant

# Datastores: localhost defaults for dev, overridden by env vars in production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/glossary_ai_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/glossary}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.cache.type=redis

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.data.mongodb.core.MongoTemplate=${MONGO_LOG:DEBUG}

# Groq API (OpenAI-compatible, free tier) - leave blank to run in mock mode
groq.api.key=${GROQ_API_KEY:}
groq.api.model=openai/gpt-oss-120b

server.port=${PORT:8080}